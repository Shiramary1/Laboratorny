<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Lesson 12</title>
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <main class="page">
        <section class="card">
            <h1>Конструктор пиццы</h1>
            <p class="subtitle">Лабораторная работа 12 по классам JavaScript</p>

            <div class="field">
                <label for="pizzaType">Вид пиццы</label>
                <select id="pizzaType">
                    <option value="">Выберите пиццу</option>
                    <option value="margarita">Маргарита</option>
                    <option value="pepperoni">Пепперони</option>
                    <option value="bavarian">Баварская</option>
                </select>
            </div>

            <div class="field">
                <label for="pizzaSize">Размер</label>
                <select id="pizzaSize">
                    <option value="">Выберите размер</option>
                    <option value="small">Маленькая</option>
                    <option value="large">Большая</option>
                </select>
            </div>

            <div class="field">
                <span class="label">Добавки</span>
                <label class="checkbox"><input type="checkbox" value="mozzarella"> Сливочная моцарелла</label>
                <label class="checkbox"><input type="checkbox" value="cheeseBorder"> Сырный борт</label>
                <label class="checkbox"><input type="checkbox" value="cheddarParmesan"> Чеддер и пармезан</label>
            </div>

            <button id="calculateBtn" type="button">Рассчитать</button>

            <div class="result" id="result">Здесь появится результат расчета.</div>
        </section>
    </main>

    <script src="./index.js"></script>
</body>
</html>
